[package]
name = "aclubierre"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1", features = ["full"]}
axum = "0.8"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
async-trait = "0.1"
uuid ={ version = "1", features = ["v4"]}
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "chrono", "uuid"] }

[dev-dependencies]
anyhow = "1"